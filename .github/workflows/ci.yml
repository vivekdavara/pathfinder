name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, GCC 14
            os: ubuntu-24.04
            cxx: g++-14
          - name: Linux, Clang 18
            os: ubuntu-24.04
            cxx: clang++-18
          - name: macOS, Apple Clang
            os: macos-15
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      # The runners come with Node and Chrome; without them the viewer's JavaScript tests and its tests in a browser
      # would be skipped, so require both.
      PATHFINDER_REQUIRE_NODE: 1
      PATHFINDER_REQUIRE_CHROME: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Ninja
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          else
            brew install ninja
          fi
          "$CXX" --version
      - name: The project's Python environment (.venv with pytest; the presets build the module for it)
        run: make venv PYTHON=python
      - name: Debug build with warnings as errors, then the GoogleTest and pytest suites
        run: make check JOBS=4
      - name: Release build and tests
        run: make release JOBS=4
      - name: Run the benchmarks briefly (a smoke test; the numbers aren't used)
        run: ./build/release/bench/pathfinder_bench --benchmark_min_time=0.01s

  sanitizers:
    name: Linux, Clang 18, ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build
      - name: Build and run the C++ tests under the sanitizers
        run: make asan JOBS=4
